[package]
name = "ai-antivirus"
version = "0.1.0"
description = "AI Powered Anti-Virus — endpoint protection"
authors = ["AI-forAll"]
edition = "2021"

[lib]
name = "ai_antivirus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
